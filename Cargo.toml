[package]
name = "agent-usage-bar"
description = "Windows tray app that shows AI coding-agent usage limits (Claude, Codex, Antigravity)"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Buim1nh/agent-usage-bar"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
jiff = { version = "0.2", features = ["serde"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }

[dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
